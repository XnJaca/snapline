<h2 class="confirm__title" mat-dialog-title>{{ data.title }}</h2>

<mat-dialog-content>
  <p class="confirm__body">{{ data.body }}</p>
</mat-dialog-content>

<mat-dialog-actions align="end" *transloco="let t">
  <button matButton type="button" (click)="close(false)">{{ t('action.cancel') }}</button>
  <button
    [class.confirm__danger]="data.danger"
    matButton="filled"
    type="button"
    (click)="close(true)"
  >
    {{ data.confirmLabel }}
  </button>
</mat-dialog-actions>
