<div class="phone" [formGroup]="group()" *transloco="let t">
  <mat-form-field appearance="outline" class="phone__country">
    <mat-label>{{ t('address.country') }}</mat-label>
    <mat-select formControlName="country">
      @for (country of countries; track country.iso) {
        <mat-option [value]="country.iso">{{ country.iso | slCountry }} +{{ country.dial }}</mat-option>
      }
    </mat-select>
  </mat-form-field>

  <mat-form-field appearance="outline" class="phone__number">
    <mat-label>{{ label() || t('customers.phone') }}</mat-label>
    <input matInput formControlName="number" type="tel" inputmode="tel" autocomplete="tel-national" />
  </mat-form-field>
</div>
