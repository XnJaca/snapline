<form [formGroup]="form" (ngSubmit)="submit()" *transloco="let t">
  <h2 mat-dialog-title>{{ t('crews.assignTitle', { crew: data.crewName }) }}</h2>

  <mat-dialog-content>
    <div class="fields">
      <mat-form-field appearance="outline" subscriptSizing="dynamic">
        <mat-label>{{ t('crews.projectRequired') }}</mat-label>
        <mat-select formControlName="projectId" (valueChange)="pickProject($event)">
          @for (project of open(); track project.id) {
            <mat-option [value]="project.id">{{ project.name }}</mat-option>
          }
        </mat-select>
      </mat-form-field>

      <mat-form-field appearance="outline" subscriptSizing="dynamic">
        <mat-label>{{ t('crews.assignFromRequired') }}</mat-label>
        <input matInput formControlName="fromDate" type="date" />
        <mat-hint>{{ t('crews.assignFromHint') }}</mat-hint>
      </mat-form-field>

      @if (error(); as key) {
        <p class="error" role="alert">{{ t(key) }}</p>
      }
    </div>
  </mat-dialog-content>

  <div class="progress" aria-hidden="true">
    @if (busy()) {
      <mat-progress-bar mode="indeterminate" />
    }
  </div>

  <mat-dialog-actions align="end">
    <button matButton type="button" (click)="cancel()">{{ t('action.cancel') }}</button>
    <button matButton="filled" type="submit" [disabled]="busy()">{{ t('action.save') }}</button>
  </mat-dialog-actions>
</form>
