<form [formGroup]="form" (ngSubmit)="submit()" *transloco="let t">
  <h2 mat-dialog-title>{{ data.site ? t('sites.edit') : t('sites.new') }}</h2>

  <mat-dialog-content>
    <div class="fields">
      <div class="field--full"><sl-address-field [group]="address" /></div>

      <!-- `subscriptSizing="dynamic"` porque su ayuda ocupa dos líneas y en modo
           fijo el subíndice es absoluto y se pisa con lo que sigue. -->
      <mat-form-field appearance="outline" subscriptSizing="dynamic" class="field--long">
        <mat-label>{{ t('sites.radius') }}</mat-label>
        <input matInput type="number" formControlName="geofenceRadiusM" min="1" />
        <mat-hint>{{ t('sites.radiusHint') }}</mat-hint>
      </mat-form-field>

      @if (error(); as failure) {
        <p class="error field--full" role="alert">{{ t('form.error.' + failure) }}</p>
      }
    </div>
  </mat-dialog-content>

  <div class="progress" aria-hidden="true">
    @if (busy()) {
      <mat-progress-bar mode="indeterminate" />
    }
  </div>

  <mat-dialog-actions align="end">
    <button matButton type="button" (click)="cancel()">{{ t('action.cancel') }}</button>
    <button matButton="filled" type="submit" [disabled]="busy()">{{ t('action.save') }}</button>
  </mat-dialog-actions>
</form>
